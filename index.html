function offer(k){
  var b=RB,h=b.house,c=h.cands[k];if(!c)return;var why=null;
  if(h.tier<c.min)why='dice que la casa es muy humilde para él';
  else if(h.ask>c.bud*(1+.25*(h.tier-c.min)))why='dice que el precio es muy alto';
  else if(Math.random()<.1)why='lo pensó mejor y se echó atrás';
  if(why){h.cands.splice(k,1);toast('❌ '+c.n+' '+why);if(!h.cands.length)h.cands=null;rentPanel(b);return;}
  var n=Date.now();h.rent={npc:c.n,price:h.ask,until:n+c.days*DAYMS,last:n};h.cands=null;sfx('coin');toast('✅ '+c.n+' aceptó alquilar');hlab(b);rentPanel(b);
}

  if(x==='book'){var q=d.v.split(':'),k=+q[0],n=+q[1],c=RP[k]*n,now=Date.now();

}

});

var MU={n:0,t:0},MCH=[[220,261.6,329.6],[174.6,220,261.6],[164.8,207.7,246.9],[220,261.6,329.6]],MBS=[110,87.3,82.4,110];
function musTick(){
  if(!ctx||muted||ctx.state!=='running'||cur!==CITY||trip||!menu.hidden){MU.t=0;return;}
  var now=ctx.currentTime;if(MU.t<now)MU.t=now+.05;
  while(MU.t<now+.35){
    var s=MU.n%16,bar=Math.floor(MU.n/16)%4,d=MU.t-now,ch=MCH[bar];
    if(s===0||s===3||s===6||s===10||s===12)tone(1750,.04,'square',.02,0,d);
    if(s===0||s===6||s===10)tone(MBS[bar],.3,'triangle',.13,0,d);
    if(s===2||s===5||s===8||s===11||s===14)tone(ch[(s>>1)%3]*2,.26,'sine',.045,0,d);
    if(s===4||s===7||s===12||s===15)nz(.09,.06,s===7?650:420,'bandpass',d);
    if(s%2===0)nz(.03,.025,6500,'highpass',d);
    MU.t+=.15;MU.n++;
  }
}
